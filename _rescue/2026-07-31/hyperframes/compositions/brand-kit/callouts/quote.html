<!-- Callout: quote card. Transparent overlay. Brand kit. -->
<div id="stage" data-composition-id="callout-quote" data-width="1920" data-height="1080" data-fps="30" data-duration="5">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap');
:root{--blue:#0066FF;--heading:'Montserrat',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;}
*{margin:0;padding:0;box-sizing:border-box}
.frame{width:1920px;height:1080px;position:relative;background:#00E000;font-family:var(--body)}
.card{position:absolute;left:120px;top:50%;transform:translateY(-50%);max-width:1080px;
  background:#fff;border-radius:16px;border:1px solid #E2E6EA;box-shadow:0 18px 50px rgba(0,0,0,.20);
  padding:44px 52px;animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.mark{font-family:var(--heading);font-size:120px;font-weight:900;color:var(--blue);line-height:.6;height:56px}
.quote{font-family:var(--heading);font-size:52px;font-weight:700;line-height:1.25;letter-spacing:-.01em;color:#111;margin-top:10px}
.by{font-family:var(--body);font-size:22px;font-weight:600;color:#777;margin-top:22px;display:flex;align-items:center;gap:12px}
.by .bar{width:34px;height:3px;background:var(--blue);border-radius:2px}
@keyframes pop{from{opacity:0;transform:translateY(-50%) scale(.96)}to{opacity:1;transform:translateY(-50%) scale(1)}}
</style>
<div class="frame">
  <div class="card" data-start="0.3" data-duration="4.4">
    <div class="mark">&ldquo;</div>
    <p class="quote">Get the body working before you plug in the brain.</p>
    <p class="by"><span class="bar"></span>The Wolf &amp; Eagle spine</p>
  </div>
</div>
</div>
