<!-- Callout: key-term lower-third. Transparent overlay. Brand kit. -->
<div id="stage" data-composition-id="callout-keyterm" data-width="1920" data-height="1080" data-fps="30" data-duration="5">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap');
:root{--blue:#0066FF;--heading:'Montserrat',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;}
*{margin:0;padding:0;box-sizing:border-box}
.frame{width:1920px;height:1080px;position:relative;background:#00E000;font-family:var(--body)}
.bar{position:absolute;left:120px;bottom:130px;display:flex;align-items:stretch;
  animation:wipe .5s cubic-bezier(.2,.7,.2,1) both}
.chip{background:var(--blue);color:#fff;font-family:var(--heading);font-weight:800;font-size:22px;letter-spacing:.1em;
  text-transform:uppercase;display:flex;align-items:center;padding:0 26px;border-radius:12px 0 0 12px}
.def{background:#fff;border:1px solid #E2E6EA;border-left:none;border-radius:0 12px 12px 0;padding:22px 34px;
  box-shadow:0 12px 40px rgba(0,0,0,.18)}
.term{font-family:var(--heading);font-size:38px;font-weight:900;letter-spacing:-.01em;color:#111;line-height:1}
.gloss{font-family:var(--body);font-size:22px;font-weight:400;color:#4A4A4A;margin-top:6px}
@keyframes wipe{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
</style>
<div class="frame">
  <div class="bar" data-start="0.3" data-duration="4.4">
    <div class="chip">Term</div>
    <div class="def">
      <p class="term">Systemise before AI</p>
      <p class="gloss">make the business run on rails, then let AI compound it</p>
    </div>
  </div>
</div>
</div>
