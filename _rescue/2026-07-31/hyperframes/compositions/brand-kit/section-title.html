<!--
  Brand Kit — Section Title (3 seconds)
  Full-screen section break with numbered label.
  Usage: Replace {{NUMBER}}, {{TITLE}}, and {{CONTEXT}} with your content.
-->
<div id="stage" data-composition-id="brand-section-title" data-width="1920" data-height="1080" data-fps="30" data-duration="3">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap');
:root {
  --blue: #0066FF;
  --heading: 'Montserrat', system-ui, sans-serif;
  --body: 'Inter', system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
.frame {
  width: 1920px;
  height: 1080px;
  background: #F7F9FA;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: 120px;
  position: relative;
}
.number {
  font-family: var(--heading);
  font-size: 120px;
  font-weight: 900;
  color: rgba(226,230,234,.6);
  line-height: 1;
  position: absolute;
  top: 80px;
  right: 100px;
}
.label {
  font-family: var(--heading);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--blue);
  margin-bottom: 20px;
}
.title {
  font-family: var(--heading);
  font-size: 64px;
  font-weight: 800;
  color: #111111;
  letter-spacing: -0.01em;
  line-height: 1.15;
  margin-bottom: 16px;
  max-width: 1200px;
}
.context {
  font-family: var(--body);
  font-size: 22px;
  font-weight: 400;
  color: #4A4A4A;
  line-height: 1.6;
  max-width: 800px;
}
.rule {
  height: 3px;
  width: 48px;
  background: var(--blue);
  margin-top: 32px;
}
</style>

<div class="frame">
  <span class="number" data-start="0" data-duration="3">{{NUMBER}}</span>
  <p class="label" data-start="0.2" data-duration="2.8">Section {{NUMBER}}</p>
  <h2 class="title" data-start="0.4" data-duration="2.6">{{TITLE}}</h2>
  <p class="context" data-start="0.7" data-duration="2.3">{{CONTEXT}}</p>
  <div class="rule" data-start="0.9" data-duration="2.1"></div>
</div>
</div>
