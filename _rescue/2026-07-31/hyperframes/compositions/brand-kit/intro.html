<!--
  Brand Kit — Intro (3 seconds)
  Full-screen branded opening with title reveal.
  Usage: Replace {{TITLE}} and {{SUBTITLE}} with your content.
-->
<div id="stage" data-composition-id="brand-intro" data-width="1920" data-height="1080" data-fps="30" data-duration="3">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap');
:root {
  --blue: #0066FF;
  --blue-dark: #0052CC;
  --heading: 'Montserrat', system-ui, sans-serif;
  --body: 'Inter', system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
.frame {
  width: 1920px;
  height: 1080px;
  background: #FFFFFF;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  padding: 120px;
  position: relative;
  overflow: hidden;
}
.accent-bar {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 6px;
  background: var(--blue);
}
.label {
  font-family: var(--heading);
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--blue);
  margin-bottom: 24px;
}
.title {
  font-family: var(--heading);
  font-size: 86px;
  font-weight: 900;
  color: #111111;
  letter-spacing: -0.02em;
  line-height: 1.05;
  margin-bottom: 20px;
}
.subtitle {
  font-family: var(--body);
  font-size: 28px;
  font-weight: 400;
  color: #4A4A4A;
  line-height: 1.5;
}
.rule {
  height: 4px;
  width: 64px;
  background: var(--blue);
  margin-top: 40px;
}
.corner-mark {
  position: absolute;
  bottom: 60px;
  right: 80px;
  font-family: var(--heading);
  font-size: 14px;
  font-weight: 700;
  color: #999999;
  letter-spacing: 0.04em;
}
</style>

<div class="frame">
  <div class="accent-bar" data-start="0" data-duration="3"></div>
  <p class="label" data-start="0.3" data-duration="2.7">{{LABEL}}</p>
  <h1 class="title" data-start="0.5" data-duration="2.5">{{TITLE}}</h1>
  <p class="subtitle" data-start="0.8" data-duration="2.2">{{SUBTITLE}}</p>
  <div class="rule" data-start="1.0" data-duration="2.0"></div>
  <span class="corner-mark" data-start="0" data-duration="3">Andrew Cockburn</span>
</div>
</div>
