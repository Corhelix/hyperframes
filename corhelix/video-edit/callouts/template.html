<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1060, height=260" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --card: #ffffff;
        --ink: #111111;
        --body: #3b4252;
        --accent: #0066ff;
        --hairline: #d9e1ee;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1060px;
        height: 260px;
        overflow: hidden;
        background: transparent;
      }
      #root {
        width: 1060px;
        height: 260px;
        display: flex;
        align-items: flex-end;
        justify-content: flex-start;
        padding: 0 0 18px 0;
      }
      #card {
        max-width: 1060px;
        padding: 26px 36px 28px 36px;
        background: var(--card);
        border: 1px solid var(--hairline);
        border-radius: 22px;
        box-shadow: 0 8px 28px rgba(17, 17, 17, 0.1);
        opacity: 0;
      }
      #tag {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 10px;
      }
      #head {
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.08;
        color: var(--ink);
        text-wrap: balance;
        font-size: {{HEAD_PX}}px;
      }
      #head.quote {
        font-weight: 600;
        font-style: italic;
      }
      #head.stat {
        color: var(--accent);
      }
      #tag:empty,
      #label:empty {
        display: none;
      }
      #label {
        font-family: "Inter", sans-serif;
        font-weight: 400;
        font-size: 30px;
        line-height: 1.25;
        color: var(--body);
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="callout"
      data-start="0"
      data-duration="{{DURATION}}"
      data-width="1060"
      data-height="260"
    >
      <div id="card" class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="0">
        <div id="tag">{{TAG}}</div>
        <div id="head" class="{{HEAD_CLASS}}">{{HEAD}}</div>
        <div id="label">{{LABEL}}</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#card", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0);
      tl.to("#card", { opacity: 0, duration: 0.3, ease: "power2.in" }, {{DURATION}} - 0.3);
      window.__timelines["callout"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
