<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Andrew Cockburn</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
      }
      [data-composition-id="talking-head"] {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      }
      [data-composition-id="talking-head"] video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      [data-composition-id="talking-head"] .caption-layer {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 120px;
        height: 200px;
        z-index: 20;
        pointer-events: none;
      }
      [data-composition-id="talking-head"] .caption-cue {
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        max-width: 1500px;
        margin: 0 auto;
        padding: 0 40px;
        text-align: center;
        font-size: 54px;
        font-weight: 700;
        line-height: 1.25;
        color: #fff;
        text-shadow: 0 3px 14px rgba(0, 0, 0, 0.72);
        opacity: 0;
        visibility: hidden;
      }
      [data-composition-id="talking-head"] .lower-third {
        position: absolute;
        left: 96px;
        bottom: 380px;
        z-index: 22;
        opacity: 0;
        visibility: hidden;
      }
      [data-composition-id="talking-head"] .lower-third .lt-name {
        font-size: 44px;
        font-weight: 700;
        color: #fff;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
      }
      [data-composition-id="talking-head"] .lower-third .lt-role {
        margin-top: 8px;
        font-size: 28px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.82);
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
      }
      [data-composition-id="talking-head"] .lower-third .lt-rule {
        width: 132px;
        height: 5px;
        margin-bottom: 18px;
        border-radius: 3px;
        background: #4da3ff;
      }
      [data-composition-id="talking-head"] .callout {
        position: absolute;
        left: 96px;
        top: 140px;
        max-width: 760px;
        padding: 26px 32px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 18px;
        background: rgba(18, 32, 54, 0.55);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.38);
        font-size: 38px;
        font-weight: 600;
        line-height: 1.3;
        color: #fff;
        z-index: 21;
        opacity: 0;
        visibility: hidden;
      }
      [data-composition-id="talking-head"] .cut-dip {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
        pointer-events: none;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div
      data-composition-id="talking-head"
      data-start="0"
      data-duration="22.5"
      data-width="1920"
      data-height="1080"
    >
      <video id="clip-v-0" src="media/source.mp4" data-start="0" data-duration="8.8" data-media-start="0.6" data-track-index="0" muted playsinline></video>
      <audio id="clip-a-0" src="media/source.mp4" data-start="0" data-duration="8.8" data-media-start="0.6" data-track-index="1" data-volume="1"></audio>
      <video id="clip-v-1" src="media/source.mp4" data-start="8.8" data-duration="7.3" data-media-start="10.9" data-track-index="0" muted playsinline></video>
      <audio id="clip-a-1" src="media/source.mp4" data-start="8.8" data-duration="7.3" data-media-start="10.9" data-track-index="1" data-volume="1"></audio>
      <video id="clip-v-2" src="media/source.mp4" data-start="16.1" data-duration="6.4" data-media-start="19.6" data-track-index="0" muted playsinline></video>
      <audio id="clip-a-2" src="media/source.mp4" data-start="16.1" data-duration="6.4" data-media-start="19.6" data-track-index="1" data-volume="1"></audio>
      <div class="cut-dip" id="cut-dip-1"></div>
      <div class="cut-dip" id="cut-dip-2"></div>
      <div class="caption-layer" id="caption-layer"></div>

      <div class="lower-third" id="lower-third">
        <div class="lt-rule"></div>
        <div class="lt-name">Andrew Cockburn</div>
        <div class="lt-role">Wolf &amp; Eagle</div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        // Caption cues on the OUTPUT timeline, already remapped through the
        // EDL. Inline and JSON-shaped so the studio caption editor can read
        // and rewrite them.
        var TRANSCRIPT = [
  {
    "text": "So most teams treat video",
    "start": 0.033,
    "end": 1.767
  },
  {
    "text": "editing as a manual craft,",
    "start": 1.833,
    "end": 3.833
  },
  {
    "text": "and that's exactly why it doesn't scale.",
    "start": 4.067,
    "end": 6.867
  },
  {
    "text": "The bottleneck was never the render.",
    "start": 7.2,
    "end": 8.767
  },
  {
    "text": "The bottleneck is the decision layer.",
    "start": 8.833,
    "end": 11.1
  },
  {
    "text": "Which forty seconds of a",
    "start": 11.5,
    "end": 13.033
  },
  {
    "text": "fifty minute recording actually matter?",
    "start": 13.1,
    "end": 15.767
  },
  {
    "text": "Answer that, and the rest",
    "start": 16.233,
    "end": 18.067
  },
  {
    "text": "is just a render pass.",
    "start": 18.133,
    "end": 19.833
  },
  {
    "text": "That is the whole product.",
    "start": 20.2,
    "end": 21.933
  }
];

        var CALLOUTS = [
  {
    "text": "The render was never the bottleneck",
    "start": 6.5,
    "dur": 3.2,
    "x": 96,
    "y": 140,
    "w": 760,
    "size": 38
  },
  {
    "text": "40 seconds out of 50 minutes",
    "start": 11.5,
    "dur": 3.5,
    "x": 96,
    "y": 140,
    "w": 700,
    "size": 42
  },
  {
    "text": "Decisions first. Render second.",
    "start": 17.5,
    "dur": 3.0,
    "x": 96,
    "y": 140,
    "w": 720,
    "size": 38
  }
];

        var COMP_DURATION = 22.5;

        var tl = gsap.timeline({ paused: true });

        // Captions. Built synchronously at load -- the capture engine reads
        // window.__timelines immediately after load, so nothing here may be
        // deferred into a promise or a timeout.
        var captionLayer = document.getElementById("caption-layer");
        var FADE = 0.12;
        TRANSCRIPT.forEach(function (cue, index) {
          var el = document.createElement("div");
          el.className = "caption-cue";
          el.textContent = cue.text;
          captionLayer.appendChild(el);

          // Hold until the cue's own end, but never past the moment the next
          // cue appears. Cues stack at the same screen position, so an
          // unbounded fade would ghost two lines over each other.
          var next = TRANSCRIPT[index + 1];
          var holdUntil = Math.max(cue.end, cue.start + 0.4);
          if (next) {
            holdUntil = Math.min(holdUntil, next.start - FADE);
            holdUntil = Math.max(holdUntil, cue.start + 0.1);
          }
          var fade = next ? Math.max(Math.min(next.start - holdUntil, FADE), 0.04) : FADE;

          tl.set(el, { visibility: "visible" }, cue.start);
          tl.fromTo(
            el,
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.14, ease: "power2.out" },
            cue.start,
          );
          tl.to(el, { opacity: 0, duration: fade, ease: "power1.in" }, holdUntil);
          // Deterministic kill. Exit tweens on captions can be left half-applied
          // when neighbouring cues overlap; the hard set guarantees the cue is
          // gone on every seek.
          tl.set(el, { opacity: 0, visibility: "hidden" }, holdUntil + fade);
        });

        // Lower third.
        var lowerThird = document.getElementById("lower-third");
        tl.set(lowerThird, { visibility: "visible" }, 0.6);
        tl.fromTo(
          lowerThird,
          { opacity: 0, x: -40 },
          { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
          0.6,
        );
        tl.to(lowerThird, { opacity: 0, duration: 0.4, ease: "power2.in" }, 5.2);
        tl.set(lowerThird, { opacity: 0, visibility: "hidden" }, 5.6);

        // Callouts, authored on the output timeline.
        var stage = document.querySelector('[data-composition-id="talking-head"]');
        CALLOUTS.forEach(function (callout, index) {
          var el = document.createElement("div");
          el.className = "callout";
          el.id = "callout-" + index;
          el.textContent = callout.text;
          if (callout.x !== undefined) el.style.left = callout.x + "px";
          if (callout.y !== undefined) el.style.top = callout.y + "px";
          if (callout.w !== undefined) el.style.maxWidth = callout.w + "px";
          if (callout.size !== undefined) el.style.fontSize = callout.size + "px";
          stage.appendChild(el);

          var out = callout.start + callout.dur;
          tl.set(el, { visibility: "visible" }, callout.start);
          tl.fromTo(
            el,
            { opacity: 0, y: 24, scale: 0.97 },
            { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "power3.out" },
            callout.start,
          );
          tl.to(el, { opacity: 0, duration: 0.3, ease: "power2.in" }, out);
          tl.set(el, { opacity: 0, visibility: "hidden" }, out + 0.3);
        });
      // Cut softeners: a short dip at each interior cut point.
      var DIP = 0.133;
      var CUT_POINTS = [8.8, 16.1];
      CUT_POINTS.forEach(function (at, i) {
        var dip = document.getElementById("cut-dip-" + (i + 1));
        if (!dip) return;
        tl.to(dip, { opacity: 0.85, duration: DIP / 2, ease: "power1.in" }, at - DIP / 2);
        tl.to(dip, { opacity: 0, duration: DIP / 2, ease: "power1.out" }, at);
        tl.set(dip, { opacity: 0 }, at + DIP / 2);
      });

        window.__timelines["talking-head"] = tl;
      </script>
    </div>
  </body>
</html>
